<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D&amp;D Tavolo - Schermo condiviso</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="screen">
<div id="banner" class="hidden">Connessione al tavolo del master...</div>
<header>
  <div class="dot" id="conn"></div>
  <img class="logo-s" src="/img/logo.png" alt="D&amp;D Tavolo">
  <div class="title" id="campaign">D&amp;D Tavolo</div>
  <div class="round" id="round"></div>
  <div class="turn" id="turn"></div>
  <button id="fsBtn">Schermo intero</button>
</header>
<div class="grid">
  <div class="col">
    <h2>Ordine di iniziativa</h2>
    <div id="initBox" style="overflow:hidden"></div>
  </div>
  <div class="center">
    <div id="trayWrap"><canvas id="tray"></canvas></div>
    <div class="col" id="lastRoll"><span class="dim">In attesa dei tiri pubblici...</span></div>
  </div>
  <div class="col">
    <h2>Missioni</h2>
    <div id="questBox" style="flex:1;overflow:hidden"></div>
    <h2>Ultimi tiri</h2>
    <div id="logBox" style="flex:1;overflow:hidden"></div>
  </div>
</div>
<script src="/common.js"></script>
<script src="/dice3d.js"></script>
<script>
(function () {
  'use strict';
  var $ = T.$, esc = T.esc;
  var tray = new DiceTray($('tray'), { hint: 'In attesa dei dadi...', tableH: 5 });
  var queue = [], playing = false, view = null, lastTurn = null;

  new T.Link('screen', function (m) {
    if (m.t === 'state') { view = m.s; render(); }
    else if (m.t === 'roll' && !m.e.secret) { queue.push(m.e); if (queue.length > 4) queue.shift(); play(); }
  }, function (st) {
    $('conn').className = 'dot ' + (st === 'open' ? 'open' : 'closed');
    $('banner').classList.toggle('hidden', st === 'open');
  });

  function play() {
    if (playing || !queue.length) return;
    playing = true;
    var e = queue.shift();
    var logical = (e.dice || []).map(function (d) { return { s: d.s }; });
    var ph = DiceMath.physicalFor(logical);
    var forced = DiceMath.forcedPhysical(e.dice || []);
    $('lastRoll').innerHTML = '<div><b>' + esc(e.who) + '</b> <span class="reason">' + esc(e.reason || e.kind) + '</span></div><div class="dim">tira...</div>';
    tray.roll(ph.specs, forced).then(function () {
      $('lastRoll').innerHTML = '<div><b>' + esc(e.who) + '</b> <span class="reason">' + esc(e.reason || e.kind) + '</span> <span class="formula">' + esc(e.formula || '') + '</span></div>' +
        '<div>' + (e.dice || []).map(function (d) {
          var cls = d.drop ? 'die drop' : (d.s === 20 && d.v === 20 ? 'die nat20' : (d.s === 20 && d.v === 1 ? 'die nat1' : 'die'));
          return '<span class="' + cls + '">' + d.v + '</span>';
        }).join('') + ' <span class="big">' + e.total + '</span>' +
        (e.outcome === 'success' ? ' <span class="ok">RIUSCITA</span>' : e.outcome === 'fail' ? ' <span class="ko">FALLITA</span>' : '') + '</div>';
      if (e.nat === 20) { tray.celebrate('crit'); DiceSfx.play('crit', 0.9); T.flash('crit', $('trayWrap')); } else if (e.nat === 1) { tray.celebrate('fumble'); DiceSfx.play('fumble', 0.9); T.flash('fumble', $('trayWrap')); }
      setTimeout(function () { playing = false; play(); }, queue.length ? 1500 : 200);
    });
  }

  function render() {
    if (!view) return;
    $('campaign').textContent = view.campaign || 'D&D Tavolo';
    var ini = view.init;
    if (ini && ini.active && ini.order.length) {
      $('round').textContent = 'Round ' + ini.round;
      var cur = null;
      ini.order.forEach(function (o) { if (o.current) cur = o; });
      $('turn').innerHTML = cur ? 'Turno di <b>' + esc(cur.name) + '</b>' : (ini.hidden_turn ? 'Turno: <b>???</b>' : '');
      var key = ini.round + ':' + (cur ? cur.name : '');
      if (key !== lastTurn && cur) {
        if (lastTurn !== null) { T.turnBanner(cur.name, 'Round ' + ini.round + ' - tocca a', cur.img); DiceSfx.play('turn', 0.6); }
        lastTurn = key;
      }
      $('initBox').innerHTML = ini.order.map(function (o, i) {
        return '<div class="init-item' + (o.current ? ' cur' : '') + (o.status === 'A terra' ? ' down' : '') + '"><span class="pos">' + (o.current ? '&#9654;' : (i + 1)) + '</span>' + T.avatar(o.img) + '<span class="nm">' + esc(o.name) + (o.cond ? ' <span class="cond">' + esc(o.cond) + '</span>' : '') + '</span>' +
          (o.kind === 'monster' ? '<span class="' + T.statusClass(o.status) + '" style="font-size:0.7em">' + esc(o.status) + '</span>' : '') + '</div>';
      }).join('');
    } else {
      $('round').textContent = '';
      $('turn').textContent = '';
      $('initBox').innerHTML = '<p class="dim">Nessun combattimento in corso.</p>';
    }
    var qs = view.quests || [];
    $('questBox').innerHTML = qs.length ? qs.filter(function (q) { return q.status === 'attiva'; }).concat(qs.filter(function (q) { return q.status !== 'attiva'; })).map(function (q) {
      return '<div class="quest"><h3>' + esc(q.title) + (q.status === 'completata' ? ' <span class="ok">&#10004;</span>' : q.status === 'fallita' ? ' <span class="ko">&#10008;</span>' : '') + '</h3>' +
        q.checks.map(function (c) {
          return '<div class="check">' + esc(c.label) + ' ' + (c.result === 'success' ? '<span class="ok">&#10004; Riuscita</span>' : c.result === 'fail' ? '<span class="ko">&#10008; Fallita</span>' : '<span class="dim">...</span>') + '</div>';
        }).join('') + '</div>';
    }).join('') : '<p class="dim">Nessuna missione visibile.</p>';
    var cr = (view.chronicle || []).slice().reverse();
    if (cr.length) $('questBox').innerHTML += '<h3 style="margin-top:14px">Ultimi avvenimenti</h3>' + cr.map(function (e) { return '<div class="chron"><span class="chron-c">' + esc(e.label) + '</span> ' + esc(e.text) + '</div>'; }).join('');
    var lg = (view.log || []).slice(0, 7);
    $('logBox').innerHTML = lg.map(function (e) { return '<div class="logline">' + T.rollLine(e) + '</div>'; }).join('') || '<p class="dim">Ancora nessun tiro.</p>';
  }

  $('fsBtn').addEventListener('click', function () {
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) req.call(el);
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen'); } catch (e) { }
  });
  document.addEventListener('fullscreenchange', function () { setTimeout(function () { tray.resize(); }, 200); });
})();
</script>
</body>
</html>
